  "components": {
    "schemas": {
      "HealthStatus": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ]
      },
      "ScrapEntry": {
        "type": "object",
        "properties": {
          "reason": {
            "type": "string"
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "maximum": 100000000
          }
        },
        "required": [
          "reason",
          "weight"
        ]
      },
      "JobInput": {
        "type": "object",
        "properties": {
          "reference": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "product": {
            "type": "string"
          },
          "material": {
            "type": "string"
          },
          "machine": {
            "type": "string"
          },
          "issued": {
            "type": "number",
            "minimum": 0,
            "maximum": 100000000
          },
          "good": {
            "type": "number",
            "minimum": 0,
            "maximum": 100000000
          },
          "reusable": {
            "type": "number",
            "minimum": 0,
            "maximum": 100000000
          },
          "rework": {
            "type": "number",
            "minimum": 0,
            "maximum": 100000000
          },
          "scrapEntries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ScrapEntry"
            }
          },
          "notes": {
            "type": "string"
          }
        },
        "required": [
          "reference",
          "product",
          "material",
          "machine",
          "issued",
          "good",
          "reusable",
          "rework",
          "scrapEntries",
          "notes"
        ]
      },
      "Metrics": {
        "type": "object",
        "properties": {
          "scrap": {
            "type": "number"
          },
          "accounted": {
            "type": "number"
          },
          "residual": {
            "type": "number"
          },
          "yieldPercent": {
            "type": "number"
          },
          "scrapPercent": {
            "type": "number"
          },
          "reusablePercent": {
            "type": "number"
          },
          "reworkPercent": {
            "type": "number"
          },
          "balanced": {
            "type": "boolean"
          },
          "largestReason": {
            "type": "string"
          },
          "largestWeight": {
            "type": "number"
          },
          "largestContribution": {
            "type": "number"
          }
        },
        "required": [
          "scrap",
          "accounted",
          "residual",
          "yieldPercent",
          "scrapPercent",
          "reusablePercent",
          "reworkPercent",
          "balanced",
          "largestReason",
          "largestWeight",
          "largestContribution"
        ]
      },
      "InvestigationNote": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "text",
          "createdAt"
        ]
      },
      "RevisionInput": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "integer"
          }
        },
        "required": [
          "revision"
        ]
      },
      "ReopenInput": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "integer"
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        },
        "required": [
          "revision",
          "reason"
        ]
      },
      "NoteInput": {
        "type": "object",
        "properties": {
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4000
          }
        },
        "required": [
          "text"
        ]
      },
      "InsightInput": {
        "type": "object",
        "properties": {
          "language": {
            "type": "string",
            "enum": [
              "en",
              "ar"
            ]
          },
          "comparisonId": {
            "type": "string"
          }
        },
        "required": [
          "language",
          "comparisonId"
        ]
      },
      "Insight": {
        "type": "object",
        "properties": {
          "text": {
            "type": "string"
          },
          "source": {
            "type": "string",
            "enum": [
              "ai",
              "fallback"
            ]
          },
          "language": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          }
        },
        "required": [
          "text",
          "source",
          "language",
          "revision"
        ]
      },
      "Baseline": {
        "type": "object",
        "properties": {
          "sufficient": {
            "type": "boolean"
          },
          "count": {
            "type": "integer"
          },
          "scrapPercent": {
            "type": [
              "number",
              "null"
            ]
          },
          "difference": {
            "type": [
              "number",
              "null"
            ]
          },
          "days": {
            "type": "integer"
          }
        },
        "required": [
          "sufficient",
          "count",
          "scrapPercent",
          "difference",
          "days"
        ]
      },
      "Comparison": {
        "type": "object",
        "properties": {
          "candidates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Job"
            }
          },
          "selected": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Job"
              },
              {
                "type": "null"
              }
            ]
          },
          "difference": {
            "type": [
              "number",
              "null"
            ]
          },
          "baseline": {
            "$ref": "#/components/schemas/Baseline"
          }
        },
        "required": [
          "candidates",
          "selected",
          "difference",
          "baseline"
        ]
      },
      "ReasonTotal": {
        "type": "object",
        "properties": {
          "reason": {
            "type": "string"
          },
          "weight": {
            "type": "number"
          },
          "contribution": {
            "type": "number"
          }
        },
        "required": [
          "reason",
          "weight",
          "contribution"
        ]
      },
      "Workspace": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "isDemo": {
            "type": "boolean"
          },
          "tolerance": {
            "type": "number"
          },
          "highScrapThreshold": {
            "type": "number"
          },
          "baselineGap": {
            "type": "number"
          }
        },
        "required": [
          "id",
          "isDemo",
          "tolerance",
          "highScrapThreshold",
          "baselineGap"
        ]
      },
      "WorkspaceInput": {
        "type": "object",
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "demo",
              "private"
            ]
          }
        },
        "required": [
          "mode"
        ]
      },
